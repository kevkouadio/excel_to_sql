<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Excel to SQL Converter</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" rel="stylesheet">
</head>

<body>
    <img src="favicon.ico" alt="Excel" class="excel-icon">
    <h2>Excel to SQL Converter</h2>
    <div class="form-container">
        <div class="form-group full-width">
            <label for="fileInput" class="custom-file-upload">
                <i class="fas fa-upload"></i> Upload Excel / CSV File
            </label>
            <input type="file" id="fileInput" accept=".xlsx,.xls,.csv" />
            <div id="selectedFileName"></div>
            <div id="fileInfo"></div>
        </div>

        <div class="form-group">
            <h3>Table Name:</h3>
            <input type="text" id="tableName" placeholder="Enter table name" />
        </div>

        <div class="form-group">
            <h3>Select Query Type:</h3>
            <select id="queryType">
                <option value="insert">INSERT</option>
                <option value="update">UPDATE</option>
            </select>
        </div>

        <div class="form-group">
            <h3>Select SQL Format:</h3>
            <select id="sqlFormat">
                <option value="mssql">MSSQL</option>
                <option value="mysql">MySQL</option>
                <option value="postgres">PostgreSQL</option>
            </select>
        </div>

        <div class="form-group full-width options-row">
            <div>
                <h3 id="whereClauseLabel" class="hidden">Select WHERE Condition Column:</h3>
                <select id="whereColumn" class="hidden"></select>
                <label id="batchInsertLabel" class="checkbox-label">
                    <input type="checkbox" id="batchInsert" checked />
                    Batch INSERT (multiple rows per statement)
                </label>
            </div>
            <div class="action-buttons">
                <button id="generateSQL" type="button">Generate SQL</button>
                <button id="clearAll" type="button" class="secondary-btn">Clear</button>
            </div>
        </div>
    </div>

    <h3 id="generateSQL-text-h3">Generated SQL:</h3>
    <p id="sqlStats"></p>
    <div id="sqlOutputContainer">
        <div class="output-actions">
            <button id="copySQL" class="copy-btn" type="button">
                <i class="fa fa-copy"></i> Copy
            </button>
            <button id="downloadSQL" class="copy-btn download-btn" type="button">
                <i class="fa fa-download"></i> Download
            </button>
        </div>
        <pre id="sqlOutput"></pre>
    </div>
    <div id="toast"></div>
    <button id="scrollUp" class="scroll-button hidden" type="button" aria-label="Scroll up">
        <i class="fas fa-arrow-up"></i>
    </button>
    <button id="scrollDown" class="scroll-button hidden" type="button" aria-label="Scroll down">
        <i class="fas fa-arrow-down"></i>
    </button>

    <script src="script.js"></script>
</body>
